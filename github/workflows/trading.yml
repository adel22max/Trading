name: Trading Channel

on:
  schedule:
    # التوقيت UTC. دمشق = UTC+3
    - cron: "3 5 * * 1-5"    # 08:03 تقويم الأخبار (الإثنين-الجمعة)
    - cron: "7 8 * * *"      # 11:07 مصطلح اليوم (كل يوم)
    - cron: "11 12 * * 1-5"  # 15:11 لمحة السوق (الإثنين-الجمعة)
    - cron: "13 16 * * *"    # 19:13 سؤال اليوم (كل يوم)
  workflow_dispatch:
    inputs:
      mode:
        description: "نوع المنشور (للتجربة اليدوية)"
        required: true
        type: choice
        options:
          - quiz
          - term
          - calendar
          - market

permissions:
  contents: write

concurrency:
  group: trading
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install requests

      - name: Post
        env:
          TRADING_BOT_TOKEN: ${{ secrets.TRADING_BOT_TOKEN }}
          TRADING_CHANNEL_ID: ${{ secrets.TRADING_CHANNEL_ID }}
          MODE_INPUT: ${{ github.event.inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MODE="$MODE_INPUT"
          if [ -z "$MODE" ]; then
            case "$SCHEDULE" in
              "3 5 * * 1-5") MODE=calendar ;;
              "7 8 * * *") MODE=term ;;
              "11 12 * * 1-5") MODE=market ;;
              "13 16 * * *") MODE=quiz ;;
              *) echo "جدولة غير معروفة: $SCHEDULE"; exit 1 ;;
            esac
          fi
          echo "mode=$MODE"
          python trading_bot.py "$MODE"

      - name: Save state
        run: |
          git config user.name "quiz-bot"
          git config user.email "quiz-bot@users.noreply.github.com"
          git add trading_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state changes"
            exit 0
          fi
          git commit -m "update trading state"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done
